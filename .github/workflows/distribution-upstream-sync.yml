name: Distribution Upstream Sync

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream ref to integrate (default is the latest official release tag)
        required: false
        type: string

permissions: {}

concurrency:
  group: distribution-upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM: coollabsio/coolify
  MANIFEST_BRANCH: distribution

jobs:
  sync:
    if: ${{ github.repository != 'coollabsio/coolify' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch --quiet --tags upstream main
          LATEST_RELEASE=$(gh api "repos/${UPSTREAM}/releases/latest" --jq '.tag_name')
          PUBLISHED_AT=$(gh api "repos/${UPSTREAM}/releases/latest" --jq '.published_at')
          TARGET_REF="${INPUT_REF:-${LATEST_RELEASE}}"
          if ! git rev-parse --verify --quiet "${TARGET_REF}^{commit}" > /dev/null; then
            git fetch --quiet upstream "${TARGET_REF}" || { echo "Unknown upstream ref ${TARGET_REF}."; exit 1; }
            TARGET_REF=FETCH_HEAD
          fi
          {
            echo "LATEST_RELEASE=${LATEST_RELEASE#v}"
            echo "LATEST_RELEASE_TAG=${LATEST_RELEASE}"
            echo "PUBLISHED_AT=${PUBLISHED_AT}"
            echo "TARGET_REF=${TARGET_REF}"
            echo "TARGET_SHA=$(git rev-parse "${TARGET_REF}^{commit}")"
            echo "BASE_VERSION=$(php bootstrap/getVersion.php)"
            echo "COMMITS_BEHIND=$(git rev-list --count HEAD..upstream/main)"
            echo "LAST_SYNCED_AT=$(git log -1 --format=%cI "$(git merge-base HEAD upstream/main)")"
          } >> "$GITHUB_ENV"

      - name: Test-merge upstream into main
        id: merge
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge-base --is-ancestor "${TARGET_SHA}" HEAD; then
            echo "state=merged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BRANCH="upstream-sync/${LATEST_RELEASE_TAG}"
          if [ -n "${INPUT_REF}" ]; then
            BRANCH="upstream-sync/$(printf '%s' "${INPUT_REF}" | tr -c 'A-Za-z0-9._-' '-')"
          fi
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          git checkout --quiet -b "${BRANCH}"
          if git merge --no-ff --no-edit -m "chore(upstream): merge ${TARGET_REF} (${TARGET_SHA})" "${TARGET_SHA}" > merge.log 2>&1; then
            echo "state=clean" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U | sort > conflicts.txt
            git merge --abort
            echo "state=conflicts" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the sync pull request
        id: pr
        if: ${{ steps.merge.outputs.state == 'clean' }}
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTION_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          git push --force-with-lease "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          EXISTING=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${BRANCH}" --state open --json url --jq '.[0].url')
          if [ -z "${EXISTING}" ]; then
            BODY=$(printf 'Merges official Coolify %s (`%s`) into this distribution.\n\nThe merge applied without conflicts. Distribution CI must pass before merging. After the merge, Distribution Build publishes a development build; promote it to staging and stable after testing.\n' "${TARGET_REF}" "${TARGET_SHA}")
            EXISTING=$(gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${BRANCH}" --title "chore(upstream): sync ${LATEST_RELEASE_TAG}" --body "${BODY}")
          fi
          echo "url=${EXISTING}" >> "$GITHUB_OUTPUT"

      - name: Report merge conflicts
        id: issue
        if: ${{ steps.merge.outputs.state == 'conflicts' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Upstream sync ${LATEST_RELEASE_TAG}: merge conflicts"
          BODY=$(printf 'Merging official Coolify %s (`%s`) into `main` conflicts in these files:\n\n%s\n\nResolve them locally:\n\n```\ngit fetch https://github.com/%s.git --tags\ngit checkout -b upstream-sync/%s main\ngit merge %s\n```\n' "${TARGET_REF}" "${TARGET_SHA}" "$(sed 's/^/- `/; s/$/`/' conflicts.txt)" "${UPSTREAM}" "${LATEST_RELEASE_TAG}" "${TARGET_SHA}")
          EXISTING=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "\"${TITLE}\" in:title" --json number --jq '.[0].number')
          if [ -n "${EXISTING}" ]; then
            gh issue edit "${EXISTING}" --repo "${GITHUB_REPOSITORY}" --body "${BODY}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --body "${BODY}"
          fi

      - name: Collect published upstream security advisories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${UPSTREAM}/security-advisories?state=published&per_page=50" \
            --jq '[.[] | {id: .ghsa_id, severity: .severity, summary: .summary, url: .html_url, first_patched_version: ([.vulnerabilities[]?.patched_versions // empty | (capture("(?<v>[0-9]+\\.[0-9]+(\\.[0-9]+)?(-(alpha|beta|rc)\\.[0-9]+)?)") | .v)?] | first)}]' \
            > advisories.json || echo '[]' > advisories.json

      - name: Publish the upstream status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISTRIBUTION: ${{ github.repository }}
          SYNC_STATE: ${{ steps.merge.outputs.state }}
          SYNC_BRANCH: ${{ steps.merge.outputs.branch }}
          SYNC_PR: ${{ steps.pr.outputs.url }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          STATE="${SYNC_STATE}"
          [ "${STATE}" = "clean" ] && STATE="pending_review"
          CONFLICTS='[]'
          [ -f conflicts.txt ] && CONFLICTS=$(jq -R . conflicts.txt | jq -s .)
          jq -n \
            --arg repository "${UPSTREAM}" \
            --arg latest "${LATEST_RELEASE}" \
            --arg published "${PUBLISHED_AT}" \
            --arg base "${BASE_VERSION}" \
            --argjson behind "${COMMITS_BEHIND}" \
            --arg state "${STATE:-unknown}" \
            --arg branch "${SYNC_BRANCH}" \
            --arg pr "${SYNC_PR}" \
            --argjson conflicts "${CONFLICTS}" \
            --slurpfile advisories advisories.json \
            --arg synced "${LAST_SYNCED_AT}" \
            --arg checked "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{repository: $repository, latest_release: $latest, latest_release_published_at: $published, base_version: $base, commits_behind: $behind, sync: {state: $state, branch: (if $branch == "" then null else $branch end), pull_request: (if $pr == "" then null else $pr end), conflicting_files: $conflicts}, advisories: $advisories[0], last_synced_at: $synced, checked_at: $checked}' \
            > upstream.json
          UPSTREAM_JSON="$PWD/upstream.json" IMAGE="${IMAGE}" bash scripts/distribution/publish-manifest.sh set-upstream
