name: Distribution Promote
run-name: Promote build ${{ inputs.build }} to ${{ inputs.channel }}

on:
  workflow_dispatch:
    inputs:
      build:
        description: Build number from the distribution manifest
        required: true
        type: string
      channel:
        description: Target channel
        required: true
        type: choice
        options: [staging, stable]
      version:
        description: Release version for stable, for example 4.4.6-fork.1
        required: false
        type: string
      summary:
        description: Short summary of the changes shown in Coolify
        required: false
        type: string

permissions: {}

concurrency:
  group: distribution-manifest
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SIGNATURE_ISSUER: https://token.actions.githubusercontent.com
  MANIFEST_BRANCH: distribution

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      digest: ${{ steps.release.outputs.digest }}
      image: ${{ steps.release.outputs.image }}
      base_version: ${{ steps.release.outputs.base_version }}
    steps:
      - name: Validate inputs
        env:
          BUILD: ${{ inputs.build }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "${BUILD}" =~ ^[1-9][0-9]{0,9}$ ]] || { echo "Invalid build number."; exit 1; }
          if [ "${CHANNEL}" = "stable" ] && [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-(alpha|beta|rc)\.[0-9]+)?-[a-z][a-z0-9]{0,15}\.[0-9]+$ ]]; then
            echo "A stable release needs a version such as 4.4.6-fork.1."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.MANIFEST_BRANCH }}
          persist-credentials: false

      - name: Read the release from the manifest
        id: release
        env:
          BUILD: ${{ inputs.build }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          RELEASE=$(jq -c --argjson build "${BUILD}" '.releases[] | select(.build == $build)' manifest.json)
          [ -n "${RELEASE}" ] || { echo "Build ${BUILD} is not in the manifest."; exit 1; }
          [ "$(jq -r '.verification.status' <<<"${RELEASE}")" = "passed" ] || { echo "Build ${BUILD} has not passed verification."; exit 1; }
          if [ "${CHANNEL}" = "stable" ] && ! jq -e '.channels | index("staging")' <<<"${RELEASE}" > /dev/null; then
            echo "Build ${BUILD} was never published on staging. Promote it to staging first."
            exit 1
          fi
          {
            echo "commit=$(jq -r '.commit' <<<"${RELEASE}")"
            echo "digest=$(jq -r '.digest' <<<"${RELEASE}")"
            echo "image=$(jq -r '.image' <<<"${RELEASE}")"
            echo "base_version=$(jq -r '.base_version' <<<"${RELEASE}")"
          } >> "$GITHUB_OUTPUT"

  promote:
    needs: validate
    runs-on: ubuntu-24.04
    environment: ${{ inputs.channel == 'stable' && 'distribution-stable' || 'distribution-staging' }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          path: source

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - name: Re-verify the signed digest before promotion
        env:
          REFERENCE: ${{ needs.validate.outputs.image }}@${{ needs.validate.outputs.digest }}
        run: |
          ESCAPED_REPOSITORY=$(printf '%s' "${GITHUB_REPOSITORY}" | sed 's/[.]/\\./g')
          cosign verify \
            --certificate-oidc-issuer "${SIGNATURE_ISSUER}" \
            --certificate-identity-regexp "^https://github\\.com/${ESCAPED_REPOSITORY}/\\.github/workflows/distribution-build\\.yml@refs/heads/main\$" \
            "${REFERENCE}" > /dev/null

      - name: Tag the existing digest
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          DIGEST: ${{ needs.validate.outputs.digest }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          TAGS=(--tag "${IMAGE}:${CHANNEL}")
          if [ -n "${VERSION}" ]; then
            TAGS+=(--tag "${IMAGE}:${VERSION}")
          fi
          docker buildx imagetools create "${IMAGE}@${DIGEST}" "${TAGS[@]}"
          PROMOTED=$(docker buildx imagetools inspect "${IMAGE}:${CHANNEL}" --format '{{json .Manifest}}' | jq -r '.digest')
          [ "${PROMOTED}" = "${DIGEST}" ] || { echo "The promoted tag resolves to ${PROMOTED}, not ${DIGEST}."; exit 1; }

      - name: Create the release tag
        if: ${{ inputs.channel == 'stable' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ needs.validate.outputs.commit }}
          DIGEST: ${{ needs.validate.outputs.digest }}
          IMAGE: ${{ needs.validate.outputs.image }}
          BASE: ${{ needs.validate.outputs.base_version }}
          BUILD: ${{ inputs.build }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" > /dev/null 2>&1; then
            echo "Tag v${VERSION} already exists."
            exit 1
          fi
          NOTES=$(printf '%s\n\n- Image: `%s@%s`\n- Build: %s\n- Commit: %s\n- Coolify base: %s\n' "${SUMMARY:-Distribution release ${VERSION}.}" "${IMAGE}" "${DIGEST}" "${BUILD}" "${COMMIT}" "${BASE}")
          gh release create "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --target "${COMMIT}" --title "v${VERSION}" --notes "${NOTES}"
          echo "NOTES_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}" >> "$GITHUB_ENV"

      - name: Update the distribution manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISTRIBUTION: ${{ github.repository }}
          IMAGE: ${{ needs.validate.outputs.image }}
          BUILD: ${{ inputs.build }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          SUMMARY: ${{ inputs.summary }}
        run: bash source/scripts/distribution/publish-manifest.sh promote
